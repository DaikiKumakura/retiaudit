url: https://daikikumakura.github.io/retiaudit/

template:
  bootstrap: 5
  bslib:
    bg: "#ffffff"
    fg: "#252525"
    primary: "#25577b"
    border-color: "#dddddd"
    line-height-base: 1.65
    headings-font-weight: 500

home:
  title: "retiaudit: inspect Python selection hints for reticulate without starting Python"
  description: >
    retiaudit is a read-only preflight for Python environment selection with
    reticulate in R. It identifies explicit overrides, project-local
    environment hints and conflicts with a requested managed environment,
    without starting Python.

navbar:
  bg: light
  type: light
  structure:
    left: [start, reference, articles, news, downloads]
    right: [search, github]
  components:
    start:
      text: Get started
      menu:
        - text: Install
          href: "index.html#installation"
        - text: First example
          href: "index.html#quick-start"
    downloads:
      text: Downloads
      menu:
        - text: Release
          href: "https://github.com/DaikiKumakura/retiaudit/releases/tag/v0.1.0"
        - text: R-universe
          href: "https://daikikumakura.r-universe.dev/retiaudit"
        - text: Zenodo
          href: "https://doi.org/10.5281/zenodo.24210476"
        - text: Portfolio
          href: "https://daikikumakura.github.io/software/retiaudit.html"

reference:
  - title: Audit
    desc: Inspect the visible hints for the Python that reticulate would select, and format the result.
    contents:
      - audit_python
      - audit_markdown
  - title: Package
    contents:
      - retiaudit-package
